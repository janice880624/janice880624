<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Janice — 運動科學 × AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#818CF8" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI','PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif}
      .m{font-family:'Fira Code','Consolas',monospace}
      @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
      @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
      .arm{transform-box:fill-box;transform-origin:10% 90%;animation:wave 1.6s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .bot{animation:bob 3s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
      .led{animation:glow 1.4s ease-in-out infinite}
      .led2{animation:glow 1.4s ease-in-out .7s infinite}
      @keyframes flow{to{stroke-dashoffset:-40}}
      .circuit{stroke-dasharray:6 14;animation:flow 1.5s linear infinite}
      @keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
      .cursor{animation:cur 1s steps(1) infinite}
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>

  <!-- 電路線 -->
  <g fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity=".7" class="circuit">
    <path d="M1200 150 H1110 V120 H1060"/>
    <path d="M1200 270 H1100 V220 H1020"/>
    <path d="M640 300 V260 H720"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="1060" cy="120" r="4" class="led"/>
    <circle cx="1020" cy="220" r="4" class="led2"/>
    <circle cx="720" cy="260" r="4" class="led"/>
  </g>

  <!-- 文字 -->
  <text x="70" y="78" class="m" font-size="18" fill="#A5B4FC">&gt; hello_world.py</text>
  <text x="70" y="142" class="t" font-size="58" font-weight="700" fill="#FFFFFF">Hi, I'm Janice<tspan class="cursor" fill="#22D3EE">_</tspan></text>
  <text x="70" y="192" class="t" font-size="26" font-weight="600" fill="#E0E7FF">運動科學 × AI ・ 鐵人三項助理教練</text>
  <text x="70" y="232" class="t" font-size="18" fill="#C7D2FE">NTUST 人工智慧跨域科技所 ・ 運動科學暨運動防護實驗室</text>
  <g transform="translate(70 262)" class="m" font-size="14">
    <rect width="96" height="28" rx="14" fill="#22D3EE" fill-opacity=".15" stroke="#22D3EE"/><text x="48" y="19" text-anchor="middle" fill="#67E8F9">#sports</text>
    <rect x="108" width="70" height="28" rx="14" fill="#F472B6" fill-opacity=".15" stroke="#F472B6"/><text x="143" y="19" text-anchor="middle" fill="#F9A8D4">#AI</text>
    <rect x="190" width="110" height="28" rx="14" fill="#FBBF24" fill-opacity=".15" stroke="#FBBF24"/><text x="245" y="19" text-anchor="middle" fill="#FDE68A">#triathlon</text>
  </g>

  <!-- 可愛機器人 -->
  <g class="bot" transform="translate(800 40)">
    <!-- 天線 -->
    <line x1="90" y1="18" x2="90" y2="44" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="90" cy="14" r="9" fill="#F472B6" class="led"/>
    <!-- 頭 -->
    <rect x="22" y="44" width="136" height="104" rx="34" fill="url(#body)"/>
    <rect x="38" y="62" width="104" height="66" rx="22" fill="#0F172A"/>
    <ellipse class="eye" cx="70" cy="94" rx="10" ry="13" fill="#22D3EE"/>
    <ellipse class="eye" cx="110" cy="94" rx="10" ry="13" fill="#22D3EE"/>
    <path d="M80 112 q10 8 20 0" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="52" cy="114" rx="7" ry="4" fill="#F472B6" opacity=".7"/>
    <ellipse cx="128" cy="114" rx="7" ry="4" fill="#F472B6" opacity=".7"/>
    <rect x="12" y="82" width="12" height="30" rx="6" fill="#94A3B8"/>
    <rect x="156" y="82" width="12" height="30" rx="6" fill="#94A3B8"/>
    <!-- 身體 -->
    <rect x="48" y="156" width="84" height="74" rx="22" fill="url(#body)"/>
    <rect x="68" y="172" width="44" height="30" rx="8" fill="#0F172A"/>
    <path d="M72 188 h8 l4 -8 l6 16 l4 -8 h14" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80" cy="216" r="4" fill="#22D3EE" class="led"/>
    <circle cx="100" cy="216" r="4" fill="#F472B6" class="led2"/>
    <!-- 手 -->
    <g class="arm"><rect x="128" y="150" width="16" height="48" rx="8" fill="#CBD5E1" transform="rotate(-35 136 190)"/><circle cx="160" cy="152" r="11" fill="#F8FAFC"/></g>
    <rect x="34" y="168" width="16" height="44" rx="8" fill="#CBD5E1"/>
  </g>
  <!-- 對話框 -->
  <g transform="translate(990 60)">
    <rect width="120" height="40" rx="14" fill="#FFFFFF"/>
    <path d="M20 40 l-6 12 l18 -12z" fill="#FFFFFF"/>
    <text x="60" y="26" text-anchor="middle" class="t" font-size="16" font-weight="700" fill="#312E81">Hello!</text>
  </g>
</svg>
